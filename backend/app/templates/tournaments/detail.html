{% extends "base.html" %}

{% block title %}Турнир — Chess Tracker{% endblock %}

{% block content %}
<div x-data="tournamentDetail({{ tournament_id }})" x-init="init()">
  <!-- Loading State -->
  <div x-show="!tournament" style="text-align:center;padding:3rem;">
    <div class="spinner" style="width:2rem;height:2rem;"></div>
    <p style="margin-top:1rem;color:var(--color-text-light);">Загрузка...</p>
  </div>

  <template x-if="tournament">
    <div>
      <!-- Tournament Header -->
      <div class="page-header">
        <div>
          <h1 x-text="tournament.name"></h1>
          <div class="tournament-meta" style="margin-top:0.5rem;color:var(--color-text-light);">
            <span x-text="'📅 ' + formatDate(tournament.start_date) + ' — ' + formatDate(tournament.end_date)"></span>
            <span x-show="tournament.location" style="margin-left:1rem;" x-text="'📍 ' + tournament.location"></span>
            <span style="margin-left:1rem;">
              <span class="badge" :class="tournament.status === 'active' ? 'badge-active' : 'badge-completed'" x-text="tournament.status === 'active' ? 'Активен' : 'Завершён'"></span>
            </span>
            <span style="margin-left:1rem;" x-text="'🎯 ' + tournament.type"></span>
            <span style="margin-left:1rem;" x-text="'🔢 ' + tournament.rounds + ' туров'"></span>
          </div>
        </div>
        <div class="tournament-header-actions" x-data="{ isAdmin: Auth.isAdmin() }">
          <a :href="'/api/tournaments/' + tournament.id + '/export/csv'" class="btn btn-success" download>
            📥 Экспорт CSV
          </a>
          <a x-show="isAdmin" :href="'/tournaments/' + tournament.id + '/edit'" class="btn btn-outline">✏️ Редактировать</a>
        </div>
      </div>

      <!-- Standings -->
      <div class="card">
        <h3 class="card-header">🏆 Турнирная таблица</h3>
        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>Игрок</th>
                <th>Очки</th>
                <th>Победы</th>
                <th>Ничьи</th>
                <th>Поражения</th>
              </tr>
            </thead>
            <tbody>
              <template x-if="!standings.length">
                <tr><td colspan="6" style="text-align:center;padding:2rem;color:var(--color-text-light);">Нет данных</td></tr>
              </template>
              <template x-for="(s, i) in standings" :key="s.player_id">
                <tr>
                  <td x-text="i + 1"></td>
                  <td><a :href="'/players/' + s.player_id" x-text="s.player_name"></a></td>
                  <td><strong x-text="s.points"></strong></td>
                  <td x-text="s.wins"></td>
                  <td x-text="s.draws"></td>
                  <td x-text="s.losses"></td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </div>

      <!-- Games by Round (Accordion) -->
      <div class="card">
        <div class="card-header" style="display:flex;justify-content:space-between;align-items:center;">
          <h3 style="margin:0;">🎮 Партии по турам</h3>
          <a x-show="Auth.isAdmin()" :href="'/tournaments/' + tournament.id + '/games/create'" class="btn btn-success">+ Добавить партию</a>
        </div>
        <template x-if="!rounds.length">
          <p style="color:var(--color-text-light);text-align:center;padding:1rem;">Партии не найдены</p>
        </template>
        <template x-for="(round, idx) in rounds" :key="idx">
          <div class="accordion-item">
            <div class="accordion-header" @click="toggleRound(idx)" style="cursor:pointer;padding:0.75rem 1rem;background:var(--color-bg);border:1px solid var(--color-border);border-radius:var(--radius-sm);margin-bottom:0.25rem;display:flex;justify-content:space-between;align-items:center;">
              <strong x-text="'Тур ' + round"></strong>
              <span :style="'transition:transform 0.2s;' + (openRounds[idx] ? 'transform:rotate(90deg);' : '')">▶</span>
            </div>
            <div x-show="openRounds[idx]" style="padding:0.75rem 1rem;">
              <table style="font-size:0.875rem;">
                <tbody>
                  <template x-for="g in gamesByRound[round]" :key="g.id">
                    <tr>
                      <td><a :href="'/players/' + g.white_player_id" x-text="g.white_player_name || '?'"></a></td>
                      <td style="text-align:center;padding:0 0.75rem;font-weight:600;" x-text="g.result || '—'"></td>
                      <td><a :href="'/players/' + g.black_player_id" x-text="g.black_player_name || '?'"></a></td>
                      <td x-show="Auth.isAdmin()" style="white-space:nowrap;">
                        <a :href="'/games/' + g.id + '/edit'" style="font-size:0.75rem;margin-right:0.5rem;">✏️</a>
                      </td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
          </div>
        </template>
      </div>

      <!-- CSV Import (admin only) -->
      <div class="card" x-show="Auth.isAdmin()">
        <h3 class="card-header">📤 Импорт CSV</h3>
        <form x-ref="importForm" @submit.prevent="importCSV()" enctype="multipart/form-data">
          <div class="form-group">
            <label>Выберите CSV-файл</label>
            <input type="file" class="form-control" accept=".csv" @change="file = $event.target.files[0]">
            <p style="font-size:0.8125rem;color:var(--color-text-light);margin-top:0.375rem;">
              Формат: игрок, тур, соперник, результат (1-0, 0-1, ½-½)
            </p>
          </div>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary" :disabled="!file || importing">
              <span x-text="importing ? 'Загрузка...' : 'Импортировать CSV'"></span>
            </button>
          </div>
          <div x-show="importMessage" :class="'flash-message flash-' + importType" style="margin-top:1rem;position:static;" x-text="importMessage"></div>
        </form>
      </div>
    </div>
  </template>
</div>
{% endblock %}

{% block extra_head %}
<script>
  document.addEventListener('alpine:init', () => {
    Alpine.data('tournamentDetail', (tournamentId) => ({
      tournamentId,
      tournament: null,
      standings: [],
      gamesByRound: {},
      rounds: [],
      openRounds: {},
      file: null,
      importing: false,
      importMessage: '',
      importType: 'info',

      async init() {
        await Promise.all([
          this.loadTournament(),
          this.loadStandings(),
          this.loadGames(),
        ]);
      },

      async loadTournament() {
        try {
          const resp = await fetch(`/api/tournaments/${this.tournamentId}`, { headers: Auth.getAuthHeaders() });
          this.tournament = await resp.json();
        } catch(e) {
          console.error('Failed to load tournament', e);
        }
      },

      async loadStandings() {
        try {
          const resp = await fetch(`/api/tournaments/${this.tournamentId}/standings`, { headers: Auth.getAuthHeaders() });
          this.standings = await resp.json();
        } catch(e) {
          console.error('Failed to load standings', e);
        }
      },

      async loadGames() {
        try {
          const resp = await fetch(`/api/tournaments/${this.tournamentId}/games?per_page=200`, { headers: Auth.getAuthHeaders() });
          const data = await resp.json();
          const games = data.items || [];
          this.gamesByRound = {};
          games.forEach(g => {
            const round = g.game_round || g.round || 1;
            if (!this.gamesByRound[round]) this.gamesByRound[round] = [];
            this.gamesByRound[round].push(g);
          });
          this.rounds = Object.keys(this.gamesByRound).sort((a, b) => a - b);
        } catch(e) {
          console.error('Failed to load games', e);
        }
      },

      toggleRound(idx) {
        this.openRounds[idx] = !this.openRounds[idx];
      },

      async importCSV() {
        if (!this.file) return;
        this.importing = true;
        this.importMessage = '';

        const formData = new FormData();
        formData.append('file', this.file);

        try {
          const resp = await fetch(`/api/tournaments/${this.tournamentId}/import/csv`, {
            method: 'POST',
            headers: Auth.getAuthHeaders(),
            body: formData,
          });
          if (resp.ok) {
            const result = await resp.json();
            this.importMessage = `Импортировано: ${result.imported || 0} партий`;
            this.importType = 'success';
            // Reload standings and games
            setTimeout(() => { this.loadStandings(); this.loadGames(); }, 500);
          } else {
            const err = await resp.json();
            this.importMessage = err.detail || 'Ошибка импорта';
            this.importType = 'error';
          }
        } catch(e) {
          this.importMessage = 'Ошибка сети';
          this.importType = 'error';
        } finally {
          this.importing = false;
        }
      }
    }));
  });
</script>
{% endblock %}
