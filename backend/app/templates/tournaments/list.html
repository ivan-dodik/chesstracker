{% extends "base.html" %}

{% block title %}Турниры — Chess Tracker{% endblock %}

{% block content %}
<div class="page-header">
  <h1>Турниры</h1>
  <div x-data="{ isAdmin: Auth.isAdmin() }" x-show="isAdmin">
    <a href="/tournaments/create" class="btn btn-success">➕ Создать турнир</a>
  </div>
</div>

<!-- Filters -->
<div class="search-bar">
  <div class="form-group">
    <select class="form-control" id="status-filter"
            onchange="loadTournamentsPage(1)">
      <option value="">Все статусы</option>
      <option value="active">Активные</option>
      <option value="completed">Завершённые</option>
    </select>
  </div>
  <div class="form-group">
    <input type="text" class="form-control" id="location-filter"
           placeholder="Город" style="max-width:200px;"
           onkeyup="debounceTournamentsLoad()">
  </div>
</div>

<!-- Tournaments Table -->
<div class="card">
  <div class="table-container">
    <div id="tournaments-table"
         hx-get="/api/tournaments"
         hx-trigger="load"
         hx-target="this"
         hx-swap="innerHTML">
      <div style="text-align:center;padding:2rem;">
        <div class="spinner"></div>
        <p style="margin-top:0.5rem;color:var(--color-text-light);">Загрузка...</p>
      </div>
    </div>
  </div>
</div>

<script>
document.addEventListener('htmx:afterSwap', function(evt) {
  if (evt.detail.target && evt.detail.target.id === 'tournaments-table') {
    try {
      const data = JSON.parse(evt.detail.xhr.responseText);
      renderTournamentsTable(evt.detail.target, data);
    } catch(e) {
      evt.detail.target.innerHTML = '<p style="color:var(--color-text-light);">Ошибка загрузки данных.</p>';
    }
  }
});

function renderTournamentsTable(target, data) {
  const items = data.items || [];
  const total = data.total || 0;
  const page = data.page || 1;
  const perPage = data.per_page || 20;

  if (items.length === 0) {
    target.innerHTML = '<div class="empty-state"><div class="empty-icon">🏟</div><p>Турниры не найдены</p></div>';
    return;
  }

  let html = '<table><thead><tr><th>#</th><th>Название</th><th>Даты</th><th>Тип</th><th>Статус</th><th>Место</th><th>Действия</th></tr></thead><tbody>';
  items.forEach(function(t, i) {
    const num = (page - 1) * perPage + i + 1;
    const statusClass = t.status === 'active' ? 'badge-active' : 'badge-completed';
    const statusText = t.status === 'active' ? 'Активен' : 'Завершён';
    const startDate = formatDate(t.start_date);
    const endDate = t.end_date ? formatDate(t.end_date) : '—';
    html += `<tr>
      <td>${num}</td>
      <td><a href="/tournaments/${t.id}">${escapeHtml(t.name)}</a></td>
      <td>${startDate} — ${endDate}</td>
      <td>${escapeHtml(t.type)}</td>
      <td><span class="badge ${statusClass}">${statusText}</span></td>
      <td>${escapeHtml(t.location || '—')}</td>
      <td>
        <a href="/tournaments/${t.id}" class="btn btn-sm btn-primary">Просмотр</a>
      </td>
    </tr>`;
  });
  html += '</tbody></table>';

  // Pagination
  const totalPages = Math.ceil(total / perPage);
  if (totalPages > 1) {
    html += '<div class="pagination">';
    html += `<button class="page-btn" onclick="loadTournamentsPage(${page - 1})" ${page <= 1 ? 'disabled' : ''}>‹</button>`;
    html += `<span class="page-info">${page} / ${totalPages}</span>`;
    html += `<button class="page-btn" onclick="loadTournamentsPage(${page + 1})" ${page >= totalPages ? 'disabled' : ''}>›</button>`;
    html += '</div>';
  }

  target.innerHTML = html;
}

let _tournamentsLoadTimer = null;
function debounceTournamentsLoad() {
  clearTimeout(_tournamentsLoadTimer);
  _tournamentsLoadTimer = setTimeout(() => loadTournamentsPage(1), 300);
}

function loadTournamentsPage(page) {
  const status = document.getElementById('status-filter').value;
  const location = document.getElementById('location-filter').value;
  let url = `/api/tournaments?page=${page}&per_page=20`;
  if (status) url += `&status=${status}`;
  if (location) url += `&location=${encodeURIComponent(location)}`;
  const target = document.getElementById('tournaments-table');
  target.innerHTML = '<div style="text-align:center;padding:2rem;"><div class="spinner"></div></div>';
  fetch(url, { headers: Auth.getAuthHeaders() })
    .then(r => r.json())
    .then(data => renderTournamentsTable(target, data))
    .catch(() => { target.innerHTML = '<p style="color:var(--color-text-light);">Ошибка загрузки.</p>'; });
}

// SSE: auto-refresh tournaments table on changes
(function() {
  function refreshTournaments() { loadTournamentsPage(1); }

  function setupTournamentsSSE() {
    if (!window.sseClient) return;
    window.sseClient.on('tournament_created', refreshTournaments);
    window.sseClient.on('tournament_updated', refreshTournaments);
    window.sseClient.on('tournament_deleted', refreshTournaments);
  }

  if (window.sseClient) {
    setupTournamentsSSE();
  } else {
    document.addEventListener('DOMContentLoaded', setupTournamentsSSE);
  }
})();
</script>
{% endblock %}
