<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Chess Tracker{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <!-- CRITICAL: Register htmx:configRequest handler BEFORE htmx loads.
       HTMX processes hx-trigger="load" elements via MutationObserver as the DOM is parsed.
       If this handler isn't registered before HTMX loads, the Authorization header
       won't be added to early HTMX requests (like favorites, top-rated on the dashboard). -->
  <script>
    document.addEventListener('htmx:configRequest', function(e) {
      var token = localStorage.getItem('jwt_token');
      if (token) {
        e.detail.headers['Authorization'] = 'Bearer ' + token;
      }
    });
    document.addEventListener('htmx:responseError', function(e) {
      if (e.detail.xhr.status === 401 && localStorage.getItem('jwt_token')) {
        localStorage.removeItem('jwt_token');
        localStorage.removeItem('user');
        window.location.href = '/login';
      }
    });
  </script>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <!-- Alpine docs: extension (main.js) defer BEFORE Alpine, guaranteed order -->
  <script defer src="/static/js/main.js"></script>
  <script defer src="https://unpkg.com/alpinejs@3.14.8"></script>
  <script defer src="/static/js/sse.js"></script>
  {% block extra_head %}{% endblock %}
</head>
<body hx-boost="true">
  <!-- Flash Messages Container (populated by JavaScript) -->
  <div class="flash-messages" id="flash-messages"></div>

  <!-- Navigation -->
  <nav class="navbar" x-data="authState()">
    <div class="navbar-inner">
      <a href="/" class="navbar-logo">
        ♟ Chess Tracker
      </a>
      <button class="navbar-toggle" aria-label="Toggle menu">☰</button>
      <ul class="navbar-links">
        <li><a href="/">Дашборд</a></li>
        <li><a href="/players">Игроки</a></li>
        <li><a href="/tournaments">Турниры</a></li>
        <li class="navbar-user" x-show="isAuth">
          <span class="username" x-text="user?.username || ''"></span>
          <button class="btn btn-sm btn-outline" style="color:white;border-color:rgba(255,255,255,0.3);" @click="logout()">Выйти</button>
        </li>
        <li class="navbar-user" x-show="!isAuth">
          <a href="/login" class="btn btn-sm btn-primary">Войти</a>
        </li>
      </ul>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="main-content">
    {% block content %}{% endblock %}
  </main>

  <!-- Footer -->
  <footer class="footer">
    Chess Tracker &copy; 2026 &mdash; Open Source Project
  </footer>
</body>
</html>
