{% extends "base.html" %}

{% block title %}Игроки — Chess Tracker{% endblock %}

{% block content %}
<div class="page-header">
  <h1>Игроки</h1>
  <div x-data="{ isAdmin: Auth.isAdmin() }" x-show="isAdmin">
    <a href="/players/create" class="btn btn-success">➕ Добавить игрока</a>
  </div>
</div>

<!-- Search and Filters -->
<div class="search-bar"
     x-data="{ name: '', ratingMin: '', ratingMax: '', city: '' }">
  <div class="form-group">
    <input type="text" class="form-control" x-model="name"
           placeholder="Поиск по имени..."
           hx-get="/api/players"
           hx-trigger="keyup changed delay:500ms"
           hx-target="#players-table"
           hx-swap="innerHTML"
           name="name">
  </div>
  <div class="form-group">
    <input type="number" class="form-control" x-model="ratingMin"
           placeholder="Рейтинг от"
           name="rating_min" style="max-width:120px;">
  </div>
  <div class="form-group">
    <input type="number" class="form-control" x-model="ratingMax"
           placeholder="Рейтинг до"
           name="rating_max" style="max-width:120px;">
  </div>
  <div class="form-group">
    <input type="text" class="form-control" x-model="city"
           placeholder="Город"
           name="city" style="max-width:150px;">
  </div>
</div>

<!-- Players Table -->
<div class="card">
  <div class="table-container">
    <div id="players-table"
         hx-get="/api/players"
         hx-trigger="load"
         hx-target="this"
         hx-swap="innerHTML">
      <div style="text-align:center;padding:2rem;">
        <div class="spinner"></div>
        <p style="margin-top:0.5rem;color:var(--color-text-light);">Загрузка...</p>
      </div>
    </div>
  </div>
</div>

<script>
document.addEventListener('htmx:afterSwap', function(evt) {
  if (evt.detail.target && evt.detail.target.id === 'players-table') {
    try {
      const data = JSON.parse(evt.detail.xhr.responseText);
      renderPlayersTable(evt.detail.target, data);
    } catch(e) {
      evt.detail.target.innerHTML = '<p style="color:var(--color-text-light);">Ошибка загрузки данных.</p>';
    }
  }
});

function renderPlayersTable(target, data) {
  const items = data.items || [];
  const total = data.total || 0;
  const page = data.page || 1;
  const perPage = data.per_page || 20;

  if (items.length === 0) {
    target.innerHTML = '<div class="empty-state"><div class="empty-icon">🏁</div><p>Игроки не найдены</p></div>';
    return;
  }

  let html = '<table><thead><tr><th>#</th><th>Имя</th><th>Рейтинг</th><th>Город</th><th>Действия</th></tr></thead><tbody>';
  items.forEach(function(p, i) {
    const num = (page - 1) * perPage + i + 1;
    html += `<tr>
      <td>${num}</td>
      <td><a href="/players/${p.id}">${escapeHtml(p.name)}</a></td>
      <td><strong>${p.rating}</strong></td>
      <td>${escapeHtml(p.city || '—')}</td>
      <td>
        <a href="/players/${p.id}" class="btn btn-sm btn-primary">Просмотр</a>
      </td>
    </tr>`;
  });
  html += '</tbody></table>';

  // Pagination
  const totalPages = Math.ceil(total / perPage);
  if (totalPages > 1) {
    html += '<div class="pagination">';
    html += `<button class="page-btn" onclick="loadPlayersPage(${page - 1})" ${page <= 1 ? 'disabled' : ''}>‹</button>`;
    html += `<span class="page-info">${page} / ${totalPages}</span>`;
    html += `<button class="page-btn" onclick="loadPlayersPage(${page + 1})" ${page >= totalPages ? 'disabled' : ''}>›</button>`;
    html += '</div>';
  }

  target.innerHTML = html;
}

function loadPlayersPage(page) {
  const url = `/api/players?page=${page}`;
  const target = document.getElementById('players-table');
  target.innerHTML = '<div style="text-align:center;padding:2rem;"><div class="spinner"></div></div>';
  fetch(url, { headers: Auth.getAuthHeaders() })
    .then(r => r.json())
    .then(data => renderPlayersTable(target, data))
    .catch(() => { target.innerHTML = '<p style="color:var(--color-text-light);">Ошибка загрузки.</p>'; });
}

function escapeHtml(str) {
  if (!str) return '';
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
</script>
{% endblock %}
