{% extends "base.html" %}
{% block title %}Редактировать игрока — Chess Tracker{% endblock %}
{% block content %}
<div class="container" x-data="playerEditForm({{ player_id }})" x-init="init()">
  <div class="page-header">
    <h1>Редактировать игрока</h1>
    <a :href="'/players/' + playerId" class="btn btn-outline">← Назад к профилю</a>
  </div>

  <!-- Loading -->
  <div x-show="loadingData" x-cloak class="text-center" style="padding: 2rem;">
    <p>⏳ Загрузка данных...</p>
  </div>

  <!-- Error message -->
  <div x-show="errorMessage" x-cloak class="alert alert-danger" x-text="errorMessage"></div>

  <!-- Success message -->
  <div x-show="successMessage" x-cloak class="alert alert-success" x-text="successMessage"></div>

  <form x-show="!loadingData" @submit.prevent="submitForm()" class="card" style="max-width: 600px;">
    <div class="form-group">
      <label for="name">Имя <span class="text-danger">*</span></label>
      <input type="text" id="name" x-model="form.name" required
             minlength="1" maxlength="100" class="form-control">
      <small class="text-muted" x-show="errors.name" x-text="errors.name"></small>
    </div>

    <div class="form-group">
      <label for="rating">Рейтинг</label>
      <input type="number" id="rating" x-model.number="form.rating" min="0"
             class="form-control">
      <small class="text-muted" x-show="errors.rating" x-text="errors.rating"></small>
    </div>

    <div class="form-group">
      <label for="city">Город</label>
      <input type="text" id="city" x-model="form.city" maxlength="100"
             class="form-control">
    </div>

    <div class="form-actions" style="margin-top: 1.5rem; display: flex; gap: 0.5rem; flex-wrap: wrap;">
      <button type="submit" class="btn btn-success" :disabled="loading">
        <span x-show="!loading">💾 Сохранить</span>
        <span x-show="loading">⏳ Сохранение...</span>
      </button>
      <a :href="'/players/' + playerId" class="btn btn-outline">Отмена</a>
      <button type="button" class="btn btn-danger" style="margin-left: auto;"
              @click="showDeleteConfirm = true" x-show="!showDeleteConfirm">
        🗑 Удалить
      </button>
    </div>

    <!-- Delete confirmation -->
    <div x-show="showDeleteConfirm" x-cloak class="alert alert-danger"
         style="margin-top: 1rem;">
      <p><strong>Вы уверены, что хотите удалить этого игрока?</strong></p>
      <p>Это действие необратимо.</p>
      <div style="display: flex; gap: 0.5rem;">
        <button type="button" class="btn btn-danger" @click="deletePlayer()" :disabled="deleting">
          <span x-show="!deleting">Да, удалить</span>
          <span x-show="deleting">⏳ Удаление...</span>
        </button>
        <button type="button" class="btn btn-outline" @click="showDeleteConfirm = false">Отмена</button>
      </div>
    </div>
  </form>
</div>

<script>
  Alpine.data('playerEditForm', (playerId) => ({
    playerId: playerId,
    form: { name: '', rating: 0, city: '' },
    errors: {},
    errorMessage: '',
    successMessage: '',
    loadingData: true,
    loading: false,
    deleting: false,
    showDeleteConfirm: false,

    async init() {
      // Guard: prevent double init (HTMX swap + Alpine re-scan)
      if (this._initialized) return;
      this._initialized = true;

      try {
        const res = await fetch('/api/players/' + this.playerId, {
          headers: Auth.getAuthHeaders(),
        });
        if (res.ok) {
          const data = await res.json();
          this.form.name = data.name || '';
          this.form.rating = data.rating || 0;
          this.form.city = data.city || '';
        } else {
          this.errorMessage = 'Ошибка загрузки данных игрока';
        }
      } catch (e) {
        this.errorMessage = 'Ошибка сети: ' + e.message;
      } finally {
        this.loadingData = false;
      }
    },

    validate() {
      this.errors = {};
      let valid = true;
      if (!this.form.name || this.form.name.trim().length === 0) {
        this.errors.name = 'Имя обязательно для заполнения';
        valid = false;
      }
      if (this.form.rating < 0) {
        this.errors.rating = 'Рейтинг не может быть отрицательным';
        valid = false;
      }
      return valid;
    },

    async submitForm() {
      this.errorMessage = '';
      this.successMessage = '';
      if (!this.validate()) return;

      this.loading = true;
      try {
        const body = { name: this.form.name.trim(), rating: this.form.rating || 0 };
        if (this.form.city && this.form.city.trim()) {
          body.city = this.form.city.trim();
        } else {
          body.city = null;
        }

        const res = await fetch('/api/players/' + this.playerId, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            ...Auth.getAuthHeaders(),
          },
          body: JSON.stringify(body),
        });

        if (res.ok) {
          this.successMessage = 'Игрок обновлён!';
          setTimeout(() => { this.successMessage = ''; }, 2000);
        } else {
          const err = await res.json();
          if (err.detail && Array.isArray(err.detail)) {
            this.errorMessage = err.detail.map(e => e.msg).join('; ');
          } else {
            this.errorMessage = 'Ошибка обновления игрока';
          }
        }
      } catch (e) {
        this.errorMessage = 'Ошибка сети: ' + e.message;
      } finally {
        this.loading = false;
      }
    },

    async deletePlayer() {
      this.deleting = true;
      try {
        const res = await fetch('/api/players/' + this.playerId, {
          method: 'DELETE',
          headers: Auth.getAuthHeaders(),
        });
        if (res.ok || res.status === 204) {
          window.location.href = '/players';
        } else {
          this.errorMessage = 'Ошибка удаления игрока';
          this.showDeleteConfirm = false;
        }
      } catch (e) {
        this.errorMessage = 'Ошибка сети: ' + e.message;
        this.showDeleteConfirm = false;
      } finally {
        this.deleting = false;
      }
    },
  }));
</script>
{% endblock %}
