<tr>
  <td>{{ num }}</td>
  <td><a href="/tournaments/{{ tournament.id }}">{{ tournament.name }}</a></td>
  <td>{{ tournament.start_date.strftime('%d.%m.%Y') if tournament.start_date else '—' }}</td>
  <td>{{ tournament.type }}</td>
  <td><span class="badge {{ 'badge-active' if tournament.status == 'active' else 'badge-completed' }}">{{ 'Активен' if tournament.status == 'active' else 'Завершён' }}</span></td>
  <td>{{ tournament.location or '—' }}</td>
  <td>
    <a href="/tournaments/{{ tournament.id }}" class="btn btn-sm btn-primary">Просмотр</a>
  </td>
</tr>
