[project]
name = "chess-tracker-backend"
version = "0.1.0"
description = "Chess Tracker Backend — FastAPI application for tracking chess tournaments"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=25.1.0",
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "bcrypt==4.0.1",
    "fastapi>=0.136.3",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pydantic-settings>=2.14.1",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.0.50",
    "slowapi>=0.1.9",
    "sse-starlette>=3.4.4",
    "uvicorn>=0.49.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "playwright>=1.52.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.16",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
"alembic/env.py" = ["E501"]
"tests/*.py" = ["E501"]
"e2e/*.py" = ["E501"]
"app/seed.py" = ["E501"]
"app/models/*.py" = ["E501"]
"app/api/*.py" = ["E501"]
"app/services/*.py" = ["E501"]
"app/core/*.py" = ["E501"]
"app/schemas/*.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["app"]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "e2e: End-to-end browser tests (Playwright)",
]
norecursedirs = ["tests/e2e"]
