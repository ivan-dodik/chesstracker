services:
  db:
    image: postgres:16
    container_name: chess-tracker-db
    environment:
      POSTGRES_USER: ct_user
      POSTGRES_PASSWORD: ct_password
      POSTGRES_DB: ct_database
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ct_user -d ct_database"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chess-tracker-backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://ct_user:ct_password@db:5432/ct_database
      DEBUG: "true"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  telegram-bot:
    build:
      context: ./telegram-bot
      dockerfile: Dockerfile
    container_name: chess-tracker-bot
    env_file:
      - .env
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: "no"

volumes:
  postgres_data: