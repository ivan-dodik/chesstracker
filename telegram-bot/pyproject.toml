[project]
name = "chess-tracker-bot"
version = "0.1.0"
description = "Chess Tracker Telegram Bot — notifications about tournament results"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pydantic-settings>=2.14.1",
    "python-telegram-bot[job-queue]>=22.7",
]

[dependency-groups]
dev = [
    "ruff>=0.15.16",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
"services/*.py" = ["E501"]
