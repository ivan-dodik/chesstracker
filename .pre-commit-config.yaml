repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.16
    hooks:
      - id: ruff
        name: ruff check (backend)
        args: [--fix]
        files: ^backend/
      - id: ruff
        name: ruff check (telegram-bot)
        args: [--fix]
        files: ^telegram-bot/
  - repo: local
    hooks:
      - id: pytest
        name: pytest (backend)
        entry: >
          bash -c '
            cd backend && uv run pytest -v --tb=short
          '
        language: system
        files: ^backend/
        pass_filenames: false
