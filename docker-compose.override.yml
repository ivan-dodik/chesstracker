services:
  backend:
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./backend/app:/app/app
      - ./logs:/app/logs
    environment:
      UVICORN_OPTS: "--host 0.0.0.0 --port 8000 --reload --log-level info"

  db:
    ports:
      - "5432:5432"

  telegram-bot:
    user: "${UID:-1000}:${GID:-1000}"
